<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>访问日志</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Microsoft YaHei,sans-serif;margin:0;background:#f6f7f9;color:#1c1e21}
  .wrap{max-width:1250px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 14px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input,button{padding:7px 10px;border:1px solid #d0d4da;border-radius:6px;font-size:14px;background:#fff}
  button{cursor:pointer}
  button:hover{background:#f0f2f5}
  .ip{font-weight:600;color:#0a58ca}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid #eceff2;text-align:left;vertical-align:top;word-break:break-all}
  th{background:#f0f2f5;font-weight:600;white-space:nowrap;cursor:pointer}
  tr:hover td{background:#fafbfc}
  .muted{color:#8a9099;font-size:12px}
  #sum{margin-left:auto;color:#8a9099;font-size:12px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;background:#eef2f7;color:#5b6673;margin-left:4px}
  .tag.xff{background:#fff1e0;color:#b35c00}
  .tag.cdn{background:#e8f4ea;color:#1e7a34}
  .tag.leak{background:#f3e8ff;color:#6d28d9}
  .tag.home{background:#e8f4ea;color:#1e7a34}
  .tag.dc{background:#fee2e2;color:#b91c1c}
  .tag.proxy{background:#fff1e0;color:#b35c00}
  .sub{font-size:11px;color:#8a9099;margin-top:2px}
  .chain{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5b6673}
  .real{font-weight:700;color:#b3261e}
  .row{cursor:pointer}
  .detail{background:#fbfcfd}
  .detail td{padding:0}
  .detail pre{margin:0;padding:12px 14px;white-space:pre-wrap;font-size:12px;line-height:1.7;font-family:ui-monospace,Consolas,monospace;color:#3b4450}
</style>
</head>
<body>
<div class="wrap">
  <h1>我的网站访问日志（IP / XFF 真实 IP 追踪）</h1>
  <div class="bar">
    <span>你的真实IP：<span class="ip" id="myip">…</span><span class="tag" id="mysrc"></span></span>
    <span id="sum"></span>
  </div>
  <div class="bar">
    <span class="muted">服务地址</span>
    <input id="srv" placeholder="留空=同源当前站点" value="" style="width:230px" title="同源打开留空即可；跨站访问时填 http://主机:端口">
    <input id="token" placeholder="token" value="yg-2026-log-8842" style="width:130px">
    <button onclick="reload()">刷新</button>
    <label class="muted"><input type="checkbox" id="auto" checked> 自动刷新(5s)</label>
    <button onclick="clearLogs()">清空日志</button>
    <span class="muted">点任意一行看完整 XFF 链路 / 原始报文</span>
  </div>
  <table>
    <thead><tr>
      <th style="width:165px">时间</th>
      <th style="width:185px">真实IP</th>
      <th style="width:130px">来源</th>
      <th style="width:250px">代理后真实IP / 判定</th>
      <th style="width:210px">XFF 链路(左=最远)</th>
      <th style="width:200px">路径</th>
      <th>UA / Referer</th>
    </tr></thead>
    <tbody id="tb"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
  </table>
</div>
<script>
  const $ = id => document.getElementById(id);
  const TOKEN = () => $('token').value.trim();
  // ===== 服务地址解析 =====
  // 后端 API 服务地址候选表（按顺序探测，第一个能连通 /api/myip 的即采用）
  // 场景 A：API 与页面同一个 Node 服务 -> 同源，第一候选即命中
  // 场景 B：页面在 Render Static Site，API 在另一个 Web Service -> 走第 2/3 候选
  // 场景 C：本地 file:// 双击打开 -> 走本机端口候选
  const FALLBACK_BACKENDS = [
    'https://yg-static-site-web.onrender.com', // 新的 Node Web Service（真实 IP 后端，日志接口可用）
    'https://yg-static-site-v2.onrender.com',  // 旧 Static Site（仅静态页，/api/* 404）
    'http://127.0.0.1:8099',
    'http://127.0.0.1:8080'
  ];

  let RESOLVED = '';    // 已探测成功的后端地址
  let USER_TYPED = false; // 用户是否手动改过服务地址

  function rawBase() {
    const v = ($('srv').value || '').trim().replace(/\/+$/, '');
    if (v) return v;
    return location.origin;
  }
  const BASE = () => RESOLVED || rawBase();

  // 依次探测候选后端
  async function resolveBase() {
    const custom = ($('srv').value || '').trim().replace(/\/+$/, '');
    const list = [];
    if (custom) list.push(custom);
    if (location.protocol !== 'file:') list.push(location.origin);
    list.push.apply(list, FALLBACK_BACKENDS);
    const seen = {};
    const uniq = list.filter(c => { if (!c || seen[c]) return false; seen[c] = 1; return true; });

    for (const c of uniq) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 2000);
        const r = await fetch(c + '/api/myip', { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(t);
        if (r && (r.ok || r.status === 403)) {
          RESOLVED = c;
          if (!custom) $('srv').value = c;
          return c;
        }
      } catch (e) {}
    }
    RESOLVED = '';
    return '';
  }
  $('srv').addEventListener('input', function(){ USER_TYPED = true; RESOLVED = ''; });
  let OPEN = {};

  async function reload(){ RESOLVED=''; await resolveBase(); await loadMyIp(); await load(); }

  async function load(){
    try{
      if (!RESOLVED) await resolveBase();
      if (!RESOLVED) {
        $('tb').innerHTML = '<tr><td colspan="7" class="muted">连不上后端 API。已尝试：' +
          (($('srv').value||'').trim() || location.origin) + ' / ' + FALLBACK_BACKENDS.join(' / ') +
          '。请确认 Web Service 已启动（Render 免费实例休眠时需先唤醒），或在「服务地址」手动填写。</td></tr>';
        return;
      }
      const url = BASE() + '/api/visits?token=' + encodeURIComponent(TOKEN());
      let r = await fetch(url);
      if(r.status === 404) r = await fetch(BASE() + '/api/logs?token=' + encodeURIComponent(TOKEN()));
      const j = await r.json();
      const d = Array.isArray(j) ? j : (Array.isArray(j.logs) ? j.logs : null);
      if(!d){ $('tb').innerHTML = '<tr><td colspan="7" class="muted">' + esc((j && (j.message||j.error)) || ('HTTP ' + r.status)) + '</td></tr>'; return; }
      // 并行拉取：WebRTC 泄漏的「代理后真实IP」+ 每个 IP 的归属判定
      const leakMap = await fetchLeaks();
      const geoMap  = await fetchGeo(d);
      $('sum').textContent = '共 ' + d.length + ' 条（最新在前）';
      if(!d.length){ $('tb').innerHTML = '<tr><td colspan="7" class="muted">暂无记录</td></tr>'; return; }
      let html = '';
      d.forEach((x,i)=>{
        const chain = (x.xffChain && x.xffChain.length) ? x.xffChain : [];
        const chainHtml = chain.length
          ? chain.map((c,j)=>'<span title="第'+(j+1)+'跳">' + esc(c) + '</span>').join(' <span class="muted">→</span> ')
          : '<span class="muted">无 XFF（直连）</span>';
        const srcTag = /CDN头/.test(x.ipSource||'') ? '<span class="tag cdn">CDN头</span>'
          : /XFF/.test(x.ipSource||'') ? '<span class="tag xff">XFF</span>'
          : '<span class="tag">直连</span>';
        const g = geoMap[x.ip] || {};
        const leak = x.sid ? leakMap[x.sid] : null;
        let realCell = '';
        if (leak && leak.ip && leak.ip !== x.ip) {
          realCell = '<span class="tag leak">WebRTC泄漏</span> <span class="real">' + esc(leak.ip) + '</span>';
        } else if (g.type) {
          realCell = '<span class="tag ' + (g.type==='住宅宽带'?'home':(g.hosting?'dc':'proxy')) + '">' + esc(g.type) + '</span>';
        } else if (/^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|::1|fc00:|fd00:)/i.test(x.ip||'')) {
          realCell = '<span class="tag">内网/本机</span>';
        } else {
          realCell = '<span class="muted">查询中…</span>';
        }
        const geoSub = (g.isp || g.asnOrg) ? '<div class="sub">' + esc(g.asnOrg||g.isp) + (g.country?' · '+esc(g.country):'') + '</div>' : '';
        html += '<tr class="row" onclick="toggle('+i+')">'
          + '<td>' + esc(fmt(x.time)) + '</td>'
          + '<td><span class="real">' + esc(x.ip||'-') + '</span>' + srcTag + '</td>'
          + '<td>' + esc(x.client||'-') + '</td>'
          + '<td>' + realCell + geoSub + '</td>'
          + '<td class="chain">' + chainHtml + '</td>'
          + '<td>' + esc(x.path||'-') + '</td>'
          + '<td class="muted">' + esc(x.ua||'-') + (x.referer? '<br>ref: '+esc(x.referer) : '') + '</td>'
          + '</tr>';
        html += '<tr class="detail" id="d'+i+'" style="display:'+(OPEN[i]?'table-row':'none')+'"><td colspan="7"><pre>' + esc(detail(Object.assign({}, x, { leakIp: (x.sid && leakMap[x.sid]) ? leakMap[x.sid].ip : '', geoType: g.type||'', geoOrg: g.asnOrg||g.isp||'', geoCountry: g.country||'' }))) + '</pre></td></tr>';
      });
      $('tb').innerHTML = html;
    }catch(e){ $('tb').innerHTML = '<tr><td colspan="7" class="muted">请求失败：' + esc(e.message || '无法连接服务，请检查"服务地址"是否填对（形如 http://127.0.0.1:8099）') + '</td></tr>'; }
  }

  function detail(x){
    const chain = x.xffChain || [];
    const lines = [];
    lines.push('时间        : ' + x.time);
    lines.push('真实IP      : ' + x.ip + '   (' + (x.ipSource||'-') + ')');
    lines.push('XFF 最后段  : ' + (x.chainLast || '-'));
    lines.push('XFF 链首段  : ' + (x.chainFirst || '-'));
    lines.push('XFF 整链    : ' + (x.xff || '-'));
    lines.push('链逐跳      :');
    if(chain.length){ chain.forEach((c,i)=> lines.push('   ['+(i+1)+'] ' + c + (i===chain.length-1 ? '   <= 真实IP(末段)' : ''))); }
    else lines.push('   （无 XFF 头，说明客户端直连服务器）');
    lines.push('TCP 直连IP  : ' + (x.socketIp || '-') + '   (通常是 CDN/反代节点)');
    lines.push('直连来源可信: ' + (x.trustedProxy ? '是 (在可信代理名单内, 已采信其头部)' : '否 (不在名单内, XFF/CF 头已忽略)'));
    if(x.cdnIp) lines.push('CDN 单值头  : ' + x.cdnIp);
    lines.push('代理透传头  : ' + (x.proxyHints && Object.keys(x.proxyHints).length ? JSON.stringify(x.proxyHints) : '（无）'));
    if(x.leakIp) lines.push('代理后真实IP: ' + x.leakIp + '   <= WebRTC 泄漏探测结果');
    if(x.geoType) lines.push('IP 归属判定 : ' + x.geoType + '  ' + (x.geoOrg||'') + '  ' + (x.geoCountry||''));
    lines.push('请求        : ' + (x.method||'') + ' ' + (x.path||''));
    lines.push('来源页      : ' + (x.referer||'-'));
    lines.push('浏览器/系统 : ' + (x.client||'-'));
    lines.push('User-Agent  : ' + (x.ua||'-'));
    return lines.join('\n');
  }

  // 取所有 sid 的 WebRTC 泄漏结果
  async function fetchLeaks(){
    try{
      const r = await fetch(BASE() + '/api/leaks?token=' + encodeURIComponent(TOKEN()), {cache:'no-store'});
      if(!r.ok) return {};
      const j = await r.json();
      return (j && typeof j==='object') ? j : {};
    }catch(e){ return {}; }
  }

  // 批量查询 IP 归属（住宅宽带 / 机房代理）
  async function fetchGeo(rows){
    const out = {};
    const ips = Array.from(new Set(rows.map(r=>r.ip).filter(Boolean)))
      .filter(ip => !/^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|::1|fc00:|fd00:|fe80:)/i.test(ip))
      .slice(0,60);
    await Promise.all(ips.map(async ip=>{
      try{
        const r = await fetch(BASE() + '/api/geo?ip=' + encodeURIComponent(ip), {cache:'no-store'});
        if(!r.ok) return;
        const j = await r.json();
        if(j && !j.error) out[ip] = j;
      }catch(e){}
    }));
    return out;
  }

  function toggle(i){
    OPEN[i] = !OPEN[i];
    const el = document.getElementById('d'+i);
    if(el) el.style.display = OPEN[i] ? 'table-row' : 'none';
  }

  async function clearLogs(){
    if(!confirm('确定清空全部访问记录？')) return;
    if (!RESOLVED) await resolveBase();
    const cu = BASE() + '/api/visits/clear?token=' + encodeURIComponent(TOKEN());
    let cr = await fetch(cu);
    if(cr.status === 404) await fetch(BASE() + '/api/clear?token=' + encodeURIComponent(TOKEN()));
    load();
  }

  function fmt(t){ const d = new Date(t); return isNaN(d) ? t : d.toLocaleString('zh-CN', {hour12:false}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function loadMyIp(){
    if (!RESOLVED) await resolveBase();
    if (!RESOLVED) { $('myip').textContent='获取失败'; $('mysrc').textContent='后端 API 未启动'; return; }
    try{
      const r = await fetch(BASE() + '/api/myip', {cache:'no-store'});
      const d = await r.json();
      $('myip').textContent = d.realIp || d.ip || '-';
      $('mysrc').textContent = d.source || '';
    }catch(e){ $('myip').textContent='获取失败'; $('mysrc').textContent = e.message || '无法连接服务'; }
  }

  resolveBase().then(()=>{ loadMyIp(); load(); });
  setInterval(()=>{ if($('auto').checked) load(); }, 5000);
</script>
</body>
</html>
